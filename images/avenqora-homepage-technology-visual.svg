<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A connected digital knowledge ecosystem</title>
<desc id="desc">A premium abstract illustration combining cloud technology, cybersecurity, business analytics and global learning connections.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset=".55" stop-color="#101329"/><stop offset="1" stop-color="#090d1b"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#327fff" stop-opacity=".38"/><stop offset="1" stop-color="#327fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="globe"><stop stop-color="#173c76"/><stop offset=".72" stop-color="#0d1e3d"/><stop offset="1" stop-color="#081326"/></radialGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79d7ff"/><stop offset=".55" stop-color="#398bff"/><stop offset="1" stop-color="#7865ff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bca6ff"/><stop offset="1" stop-color="#6c5dff"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ac9ff" stop-opacity=".22"/><stop offset="1" stop-color="#3266d9" stop-opacity=".035"/></linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8db8ff" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
